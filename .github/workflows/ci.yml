name: docs

on:
  pull_request:
  push:
    branches: [main]
  # dev-environment 側の変更で引用や版がずれたことにも気づけるよう、週 1 回も検査する（公開はしない。失敗したら Issue を起票）
  schedule:
    - cron: "41 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # 版は constraints.txt で固定する（deps-lock.yml が作る）
      - name: install
        run: |
          if [ -f constraints.txt ]; then
            pip install -r requirements.txt -c constraints.txt
          else
            echo "::warning::constraints.txt がありません（版を固定せずに入れます）"
            pip install -r requirements.txt
          fi
      - name: chapter structure
        run: python scripts/check_chapters.py
      - name: build (strict — broken links and nav gaps fail)
        run: mkdocs build --strict
      # {{ versions.* }} が展開されずに残っていないか（render_macros の付け忘れ）
      - name: macros rendered
        run: |
          if grep -rl --include=*.html '{{ *versions\.' site; then
            echo "::error::{{ versions.* }} が展開されていないページがあります（先頭に render_macros: true が必要）"
            exit 1
          fi
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name == 'push'
        with:
          path: site

  # 引用したコードと本文の版が dev-environment（main / exercise-base）の実物と一致するか. 一致しなければ公開（deploy）しない
  code-quotes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: tests
        run: python -m unittest discover -s tests -v
      - name: check_code_quotes
        run: python scripts/check_code_quotes.py
      - name: check_versions
        run: python scripts/check_versions.py

  # 執筆者の多くは Windows. 検査スクリプトとそのテストが Windows でも動くこと
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1" # パイプに日本語を出しても落ちないように（Windows の既定の文字コード対策）
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: tests
        run: python -m unittest discover -s tests -v
      - name: check_chapters
        run: python scripts/check_chapters.py
      - name: check_code_quotes
        run: python scripts/check_code_quotes.py
      - name: check_versions
        run: python scripts/check_versions.py

  # 検査スクリプトとテストの静的解析・書式（設定は ruff.toml）
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install "ruff==0.16.10"
      - run: ruff check --output-format=github .
      - run: ruff format --check .

  # 検査スクリプトの SAST（bandit）と、サイトの生成に使う依存の脆弱性（pip-audit）
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install "bandit==1.8.6" "pip-audit==2.9.0"
      - name: SAST（bandit. 中以上）
        run: bandit -q -r scripts -ll
      - name: 依存の脆弱性（pip-audit。constraints.txt の版で）
        run: pip-audit -r constraints.txt --progress-spinner off

  # 公開は検査（security を含む）がすべて通ったときだけ. tests/test_workflow.py が needs を確かめる
  deploy:
    if: github.event_name == 'push'
    needs: [build, code-quotes, windows, lint, security]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # 週 1 回の検査が失敗したら Issue を起票する（同じタイトルの Issue が開いていれば、コメントを追記する）
  report-scheduled-failure:
    if: failure() && github.event_name == 'schedule'
    needs: [build, code-quotes, windows, lint, security]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TITLE: "週 1 回の検査（docs）が失敗しました"
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Issue を起票または追記
        run: |
          body="$(printf '%s\n\n%s\n%s\n\n%s' \
            "週 1 回の定期実行で、教材の検査が失敗しました（$(date -u +%Y-%m-%d)）。" \
            "- 実行結果: ${RUN_URL}" \
            "- 結果: build=${{ needs.build.result }} / code-quotes=${{ needs.code-quotes.result }} / windows=${{ needs.windows.result }} / lint=${{ needs.lint.result }} / security=${{ needs.security.result }}" \
            "dev-environment 側の変更で、引用したコード（check_code_quotes.py）や版（check_versions.py）がずれた可能性があります。")"
          number="$(gh issue list --state open --search "in:title \"${TITLE}\"" --json number,title \
            --jq "map(select(.title == \"${TITLE}\")) | .[0].number // empty")"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
            echo "追記: #$number"
          else
            gh issue create --title "$TITLE" --body "$body"
          fi
