site_name: 開発者向け教材（Java / Spring Boot）
site_description: 新しく参加した開発者が、環境構築から実ソースの読解・API・非同期処理・設計品質・クラウドとアーキテクチャまでを順に学ぶ教材
site_url: https://shoyo-maya-bot.github.io/learning-materials/
repo_url: https://github.com/shoyo-maya-bot/learning-materials
edit_uri: edit/main/docs/
docs_dir: docs
theme:
  name: material
  language: ja
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: {icon: material/weather-night, name: ダークモード}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: {icon: material/weather-sunny, name: ライトモード}
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.tasklist:
      custom_checkbox: true
  - tables
  - toc:
      permalink: true
  - attr_list
plugins:
  - search:
      lang: ja
  # 本文の版を extra.versions の 1 か所にまとめ、{{ versions.xxx }} で参照する.
  # {{ }} を書くページだけで展開する（先頭に render_macros: true）. Karate などの {{ }} を含むコードを壊さないため
  - macros:
      render_by_default: false
      on_undefined: strict
      on_error_fail: true
# 本文に書く版. 演習で使う dev-environment の exercise-base ブランチのもの（main はもっと新しいことがある）.
# scripts/check_versions.py（CI）が exercise-base の build.gradle・gradle-wrapper.properties・docker-compose.yml と照合する.
extra:
  versions:
    branch: exercise-base
    java: "17"
    spring_boot: "4.0.7"
    mybatis_starter: "4.0.1"
    gradle: "8.14.3"
    postgres: "16"
    karate: "1.5.1"
validation:
  links:
    not_found: warn
    anchors: warn
